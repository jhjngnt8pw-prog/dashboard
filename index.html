<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-600: #475569;
  --slate-900: #0f172a;
  --blue-500: #3b82f6;
  --blue-600: #2563eb;
  --indigo-50: #eef2ff;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "IBM Plex Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(180deg, var(--slate-100) 0%, var(--slate-200) 100%);
  min-height: 100vh;
  padding: 16px;
  color: var(--slate-900);
}

.container {
  max-width: 900px;
  margin: 60px auto 0;
}

.header-card {
  padding: 24px 28px;
  border: 1px solid var(--slate-200);
  border-radius: 12px;
  background: linear-gradient(120deg, var(--slate-50) 0%, var(--indigo-50) 100%);
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
  margin-bottom: 24px;
}

.header-card h1 {
  font-size: 1.5rem;
  margin-bottom: 6px;
}

.header-card p {
  color: var(--slate-600);
  font-size: 14px;
}

/* Dashboard link cards */
.card-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.card {
  flex: 1 1 320px;
  max-width: 420px;
  border: 1px solid var(--slate-200);
  border-radius: 12px;
  background: var(--white);
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
  padding: 20px 22px;
  transition: box-shadow 0.15s, border-color 0.15s;
  text-decoration: none;
  color: inherit;
  display: block;
}

.card:hover {
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.10);
  border-color: var(--blue-500);
}

.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--blue-600);
}

.card-desc {
  font-size: 13px;
  color: var(--slate-600);
  line-height: 1.5;
}

.footer {
  text-align: right;
  font-size: 11px;
  color: var(--slate-600);
  margin-top: 32px;
  padding-top: 10px;
  border-top: 1px solid var(--slate-200);
}
</style>
</head>
<body>
<div class="container">

<div class="header-card">
  <h1>Static Dashboards</h1>
  <p>Self‑contained HTML reports generated from market data.</p>
</div>

<div class="card-grid">

  <a class="card" href="ConvertibleBond/cb_market_data.html">
    <div class="card-title">Convertible Bond Market Data</div>
    <div class="card-desc">
      Daily record counts for bond lists, prices, risk data, and notice data
      sourced from MongoDB.
    </div>
  </a>

  <!-- Placeholder for future dashboards -->
  <!--
  <a class="card" href="...">
    <div class="card-title">...</div>
    <div class="card-desc">...</div>
  </a>
  -->

</div>

<div class="footer">
  &nbsp;
</div>

</div>
</body>
</html>
