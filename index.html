<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的测试页面</title>
    <!-- 使用一点内联样式，让页面看起来更美观 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 9999px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        p {
            color: #4b5563;
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }
        .timestamp {
            font-size: 0.9rem;
            color: #6b7280;
            background: #f3f4f6;
            padding: 8px 16px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 8px;
        }
        .icon {
            font-size: 3.2rem;
            margin-bottom: 8px;
            display: block;
        }
        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 24px 0;
        }
        .footer {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 16px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🚀</span>
        <h1>部署成功！</h1>
        <span class="badge">✅ GitHub Pages 在线</span>
        
        <p>
            如果你能看到这个页面，说明你的静态网站已经成功部署到了 GitHub Pages。
            这是一个测试用 index.html 文件，你可以用你自己的内容替换它。
        </p>

        <hr />

        <div>
            <span class="timestamp" id="timeDisplay">⏱️ 加载时间...</span>
        </div>

        <div class="footer">
            <p>✨ 由 <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> 强力驱动</p>
        </div>
    </div>

    <script>
        // 页面加载后显示当前时间
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const formatted = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('timeDisplay').textContent = '🕒 ' + formatted;
        });
    </script>
</body>
</html>
