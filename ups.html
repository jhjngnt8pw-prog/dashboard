<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-10-04 05:10:03", "2026-10-04 05:15:03", "2026-10-04 05:20:03", "2026-10-04 05:25:03", "2026-10-04 05:30:02", "2026-10-04 05:35:02", "2026-10-04 05:40:02", "2026-10-04 05:45:03", "2026-10-04 05:50:02", "2026-10-04 05:55:03", "2026-10-04 06:00:03", "2026-10-04 06:05:03", "2026-10-04 06:10:03", "2026-10-04 06:15:03", "2026-10-04 06:20:02", "2026-10-04 06:25:03", "2026-10-04 06:30:02", "2026-10-04 06:35:03", "2026-10-04 06:40:03", "2026-10-04 06:45:03", "2026-10-04 06:50:03", "2026-10-04 06:55:02", "2026-10-04 07:00:02", "2026-10-04 07:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [100.0, 72.75, 100.0, 100.0, 63.7, 100.0, 100.0, 100.0, 100.0, 100.0, 65.97, 68.23, 72.75, 100.0, 68.23, 72.75, 100.0, 100.0, 100.0, 100.0, 72.75, 70.48, 100.0, 100.0];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
