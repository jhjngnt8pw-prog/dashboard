<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-11-04 17:10:02", "2026-11-04 17:15:02", "2026-11-04 17:20:02", "2026-11-04 17:25:02", "2026-11-04 17:30:02", "2026-11-04 17:35:02", "2026-11-04 17:40:02", "2026-11-04 17:45:02", "2026-11-04 17:50:02", "2026-11-04 17:55:02", "2026-11-04 18:00:02", "2026-11-04 18:05:02", "2026-11-04 18:10:02", "2026-11-04 18:15:02", "2026-11-04 18:20:02", "2026-11-04 18:25:02", "2026-11-04 18:30:02", "2026-11-04 18:35:02", "2026-11-04 18:40:02", "2026-11-04 18:45:02", "2026-11-04 18:50:02", "2026-11-04 18:55:02", "2026-11-04 19:00:02", "2026-11-04 19:05:03"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 91, 92, 93, 94, 95, 97, 98, 99];
const runtimeMin = [59.18, 59.18, 56.93, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 59.18, 49.73, 52.37, 52.93, 53.52, 54.08, 56.8, 55.78, 56.35];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
