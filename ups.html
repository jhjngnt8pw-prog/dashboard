<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-09-23 15:10:02", "2026-09-23 15:15:02", "2026-09-23 15:20:03", "2026-09-23 15:25:02", "2026-09-23 15:30:02", "2026-09-23 15:35:02", "2026-09-23 15:40:02", "2026-09-23 15:45:02", "2026-09-23 15:50:03", "2026-09-23 15:55:03", "2026-09-23 16:00:03", "2026-09-23 16:05:03", "2026-09-23 16:10:03", "2026-09-23 16:15:02", "2026-09-23 16:20:02", "2026-09-23 16:25:02", "2026-09-23 16:30:02", "2026-09-23 16:35:02", "2026-09-23 16:40:02", "2026-09-23 16:45:02", "2026-09-23 16:50:02", "2026-09-23 16:55:02", "2026-09-23 17:00:02", "2026-09-23 17:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [100.0, 61.45, 59.18, 100.0, 100.0, 100.0, 65.97, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 70.48, 100.0, 61.45, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
