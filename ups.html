<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-09-23 19:10:02", "2026-09-23 19:15:02", "2026-09-23 19:20:02", "2026-09-23 19:25:03", "2026-09-23 19:30:02", "2026-09-23 19:35:03", "2026-09-23 19:40:03", "2026-09-23 19:45:03", "2026-09-23 19:50:03", "2026-09-23 19:55:03", "2026-09-23 20:00:03", "2026-09-23 20:05:02", "2026-09-23 20:10:02", "2026-09-23 20:15:02", "2026-09-23 20:20:02", "2026-09-23 20:25:02", "2026-09-23 20:30:02", "2026-09-23 20:35:02", "2026-09-23 20:40:02", "2026-09-23 20:45:02", "2026-09-23 20:50:02", "2026-09-23 20:55:02", "2026-09-23 21:00:02", "2026-09-23 21:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [68.23, 100.0, 70.48, 63.7, 100.0, 100.0, 100.0, 100.0, 100.0, 72.75, 100.0, 100.0, 100.0, 100.0, 100.0, 65.97, 100.0, 100.0, 72.75, 100.0, 100.0, 100.0, 100.0, 70.48];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
