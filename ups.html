<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-10-15 09:10:03", "2026-10-15 09:15:03", "2026-10-15 09:20:03", "2026-10-15 09:25:03", "2026-10-15 09:30:03", "2026-10-15 09:35:03", "2026-10-15 09:40:02", "2026-10-15 09:45:02", "2026-10-15 09:50:02", "2026-10-15 09:55:02", "2026-10-15 10:00:02", "2026-10-15 10:05:02", "2026-10-15 10:10:02", "2026-10-15 10:15:02", "2026-10-15 10:20:02", "2026-10-15 10:25:02", "2026-10-15 10:30:02", "2026-10-15 10:35:02", "2026-10-15 10:40:02", "2026-10-15 10:45:02", "2026-10-15 10:50:02", "2026-10-15 10:55:02", "2026-10-15 11:00:02", "2026-10-15 11:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [61.45, 59.18, 59.18, 59.18, 61.45, 59.18, 59.18, 61.45, 61.45, 59.18, 59.18, 61.45, 56.93, 59.18, 59.18, 61.45, 59.18, 61.45, 59.18, 59.18, 61.45, 61.45, 59.18, 59.18];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
