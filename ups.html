<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-10-11 01:10:03", "2026-10-11 01:15:03", "2026-10-11 01:20:03", "2026-10-11 01:25:03", "2026-10-11 01:30:03", "2026-10-11 01:35:03", "2026-10-11 01:40:02", "2026-10-11 01:45:02", "2026-10-11 01:50:02", "2026-10-11 01:55:02", "2026-10-11 02:00:02", "2026-10-11 02:05:02", "2026-10-11 02:10:02", "2026-10-11 02:15:03", "2026-10-11 02:20:02", "2026-10-11 02:25:02", "2026-10-11 02:30:02", "2026-10-11 02:35:02", "2026-10-11 02:40:03", "2026-10-11 02:45:03", "2026-10-11 02:50:03", "2026-10-11 02:55:02", "2026-10-11 03:00:03", "2026-10-11 03:05:03"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [100.0, 72.75, 100.0, 100.0, 72.75, 100.0, 100.0, 72.75, 100.0, 100.0, 100.0, 100.0, 100.0, 65.97, 100.0, 68.23, 100.0, 70.48, 65.97, 100.0, 65.97, 100.0, 100.0, 68.23];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
