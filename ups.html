<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-10-18 02:10:02", "2026-10-18 02:15:02", "2026-10-18 02:20:02", "2026-10-18 02:25:02", "2026-10-18 02:30:02", "2026-10-18 02:35:02", "2026-10-18 02:40:02", "2026-10-18 02:45:02", "2026-10-18 02:50:02", "2026-10-18 02:55:02", "2026-10-18 03:00:03", "2026-10-18 03:05:02", "2026-10-18 03:10:02", "2026-10-18 03:15:02", "2026-10-18 03:20:02", "2026-10-18 03:25:02", "2026-10-18 03:30:02", "2026-10-18 03:35:02", "2026-10-18 03:40:02", "2026-10-18 03:45:02", "2026-10-18 03:50:02", "2026-10-18 03:55:03", "2026-10-18 04:00:02", "2026-10-18 04:05:03"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [68.23, 61.45, 72.75, 68.23, 70.48, 100.0, 56.93, 65.97, 59.18, 63.7, 63.7, 61.45, 100.0, 70.48, 63.7, 100.0, 63.7, 65.97, 68.23, 63.7, 100.0, 63.7, 100.0, 68.23];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
