<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-09-23 13:10:02", "2026-09-23 13:15:02", "2026-09-23 13:20:02", "2026-09-23 13:25:02", "2026-09-23 13:30:02", "2026-09-23 13:35:02", "2026-09-23 13:40:02", "2026-09-23 13:45:02", "2026-09-23 13:50:02", "2026-09-23 13:55:02", "2026-09-23 14:00:02", "2026-09-23 14:05:02", "2026-09-23 14:10:02", "2026-09-23 14:15:02", "2026-09-23 14:20:02", "2026-09-23 14:25:02", "2026-09-23 14:30:02", "2026-09-23 14:35:02", "2026-09-23 14:40:02", "2026-09-23 14:45:02", "2026-09-23 14:50:02", "2026-09-23 14:55:02", "2026-09-23 15:00:02", "2026-09-23 15:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [72.75, 72.75, 100.0, 70.48, 72.75, 100.0, 65.97, 72.75, 100.0, 100.0, 70.48, 100.0, 72.75, 100.0, 100.0, 100.0, 70.48, 100.0, 100.0, 100.0, 72.75, 100.0, 100.0, 100.0];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
