<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>UPS 监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div style="max-width: 1200px; height: 640px; margin: 20px auto;">
<canvas id="chart"></canvas>
</div>
<script>
const labels = ["2026-10-22 17:10:02", "2026-10-22 17:15:02", "2026-10-22 17:20:02", "2026-10-22 17:25:02", "2026-10-22 17:30:02", "2026-10-22 17:35:02", "2026-10-22 17:40:02", "2026-10-22 17:45:02", "2026-10-22 17:50:02", "2026-10-22 17:55:02", "2026-10-22 18:00:02", "2026-10-22 18:05:02", "2026-10-22 18:10:02", "2026-10-22 18:15:02", "2026-10-22 18:20:02", "2026-10-22 18:25:02", "2026-10-22 18:30:02", "2026-10-22 18:35:02", "2026-10-22 18:40:02", "2026-10-22 18:45:02", "2026-10-22 18:50:02", "2026-10-22 18:55:02", "2026-10-22 19:00:03", "2026-10-22 19:05:02"];
const charge = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100];
const runtimeMin = [59.18, 54.67, 52.4, 59.18, 59.18, 61.45, 56.93, 59.18, 59.18, 56.93, 56.93, 59.18, 56.93, 59.18, 56.93, 52.4, 54.67, 56.93, 54.67, 56.93, 54.67, 54.67, 59.18, 56.93];
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'battery.charge (%)',
        data: charge,
        yAxisID: 'yCharge',
        borderColor: 'rgb(54, 162, 235)',
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        tension: 0.2
      },
      {
        label: 'battery.runtime (min)',
        data: runtimeMin,
        yAxisID: 'yRuntime',
        borderColor: 'rgb(255, 99, 132)',
        backgroundColor: 'rgba(255, 99, 132, 0.2)',
        tension: 0.2
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      yCharge: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'battery.charge (%)' }
      },
      yRuntime: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'battery.runtime (min)' },
        grid: { drawOnChartArea: false }
      }
    }
  }
});
</script>
</body>
</html>
